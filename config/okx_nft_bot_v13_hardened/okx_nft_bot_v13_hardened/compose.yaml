services:
  okx-nft-bot:
    build:
      context: .
    container_name: okx-nft-bot
    restart: unless-stopped
    env_file:
      - .env
    command: ["run-daemon"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "okx-nft-bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  okx-nft-bot-sales-stream:
    build:
      context: .
      dockerfile: Dockerfile.sales-stream
    container_name: okx-nft-bot-sales-stream
    restart: unless-stopped
    env_file:
      - .env
    command: ["sales-stream"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "okx-nft-bot", "sales-stats"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  okx-nft-bot-telegram:
    build:
      context: .
    container_name: okx-nft-bot-telegram
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        while true; do
          if [ -n "$$TELEGRAM_BOT_TOKEN" ]; then
            okx-nft-bot poll-telegram-once || true;
          else
            echo "TELEGRAM_BOT_TOKEN not set; telegram poller sleeping";
          fi;
          sleep $${TELEGRAM_POLL_INTERVAL_SECONDS:-5};
        done
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "okx-nft-bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
